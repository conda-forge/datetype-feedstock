{% set name = "datetype" %}
{% set version = "2025.10.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/datetype-{{ version }}.tar.gz
  sha256: 42ac51ed9b33a6eaf082802b8a83d14f456b51e715b1167c131acd352595aacd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - pip
    - wheel
  run:
    - python >={{ python_min }}

test:
  imports:
    - datetype
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/glyph/DateType
  summary: A type wrapper for the standard library `datetime` that supplies stricter checks.
  license: AGPL-3.0-only
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - thewchan
